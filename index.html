
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Food Menu</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Kanit', sans-serif;
}

body {
    background: #fff8ed;
    color: #333;
}

/* Navbar */
nav {
    background: #e67e22;
    color: white;
    padding: 18px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 3px 10px #0002;
}

.logo {
    font-size: 25px;
    font-weight: 600;
}

nav ul {
    display: flex;
    list-style: none;
    gap: 25px;
}

nav a {
    color: white;
    text-decoration: none;
    font-size: 16px;
}

nav a:hover {
    color: #ffe0b2;
}

/* Main */
.container {
    max-width: 850px;
    margin: 55px auto;
    padding: 20px;
    text-align: center;
}

h1 {
    color: #d35400;
    font-size: 36px;
    margin-bottom: 10px;
}

.subtitle {
    color: #777;
    margin-bottom: 30px;
}

/* Food Card */
.food-card {
    background: white;
    border-radius: 22px;
    overflow: hidden;
    max-width: 550px;
    margin: auto;
    box-shadow: 0 8px 25px #0002;
    transition: 0.3s;
}

.food-card:hover {
    transform: translateY(-5px);
}

.food-card img {
    width: 100%;
    height: 300px;
    object-fit: cover;
}

.food-info {
    padding: 25px;
}

.food-info h2 {
    color: #d35400;
    font-size: 27px;
    margin-bottom: 10px;
}

.food-info p {
    color: #666;
    margin-bottom: 15px;
}

.price {
    color: #e67e22;
    font-size: 25px;
    font-weight: 600;
}

/* Random Button */
button {
    background: linear-gradient(135deg, #f39c12, #e67e22);
    color: white;
    border: none;
    padding: 14px 40px;
    border-radius: 50px;
    font-size: 19px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 25px;
    box-shadow: 0 5px 15px #e67e2255;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.07);
    background: #d35400;
}

button:active {
    transform: scale(0.95);
}

footer {
    text-align: center;
    padding: 25px;
    color: #999;
    margin-top: 30px;
}

/* Responsive */
@media(max-width: 600px) {
    nav {
        flex-direction: column;
        gap: 10px;
    }

    h1 {
        font-size: 28px;
    }

    .food-card img {
        height: 220px;
    }
}
</style>
</head>

<body>

<!-- Navbar -->
<nav>
    <div class="logo">🍜 Food Random</div>
    <ul>
        <li><a href="#">หน้าแรก</a></li>
        <li><a href="#menu">สุ่มอาหาร</a></li>
        <li><a href="#about">เกี่ยวกับเรา</a></li>
    </ul>
</nav>

<!-- Main Content -->
<div class="container" id="menu">

    <h1>วันนี้กินอะไรดี? 🍽️</h1>
    <p class="subtitle">
        เบื่อไหมกับการคิดไม่ออกว่าจะกินอะไร?
        กดปุ่มด้านล่างเพื่อสุ่มเมนูอาหารกันเลย!
    </p>

    <!-- Food Display -->
    <div class="food-card">

        <img id="foodImage"
        src="https://images.unsplash.com/photo-1562565652-a0d8f0c59eb4?w=900"
        alt="Food Menu">

        <div class="food-info">
            <h2 id="foodName">ข้าวผัด</h2>

            <p id="foodDescription">
                ข้าวผัดหอมกลิ่นกระทะ
                ผัดกับไข่และเครื่องปรุงรสแสนอร่อย
            </p>

            <div class="price" id="foodPrice">
                ราคา 45 บาท
            </div>
        </div>

    </div>

    <!-- Random Button -->
    <button onclick="randomFood()">
        🎲 สุ่มเมนูอาหาร
    </button>

</div>

<footer id="about">
    © 2026 Food Random | เว็บไซต์สุ่มเมนูอาหาร 🍴
</footer>

<script>

// รายการอาหารทั้งหมด
const foods = [
    {
        name: "ข้าวผัด",
        description: "ข้าวผัดหอมกลิ่นกระทะ ผัดกับไข่และเครื่องปรุงรสแสนอร่อย",
        price: 45,
        image: "images/kao pad.jpg"
    },
    {
        name: "ผัดกะเพราหมู",
        description: "ผัดกะเพราหมูรสจัดจ้าน หอมใบกะเพรา เสิร์ฟพร้อมข้าวสวย",
        price: 50,
        image: "images/kra pao.jpg"
    },
    {
        name: "ผัดไทย",
        description: "เส้นจันท์ผัดกับซอสรสกลมกล่อม ใส่ไข่และถั่วลิสง",
        price: 60,
        image: "images/pad thai.jpg"
    },
    {
        name: "แกงเขียวหวาน",
        description: "แกงเขียวหวานไก่กะทิเข้มข้น หอมเครื่องแกงไทย",
        price: 65,
        image: "images/kheaw wan.jpg"
    },
    {
        name: "ข้าวมันไก่",
        description: "ไก่นุ่มพร้อมข้าวมันหอม ๆ เสิร์ฟคู่กับน้ำจิ้มรสเด็ด",
        price: 50,
        image: "images/kao mun kai.jpg"
    },
    {
        name: "ข้าวไข่เจียว",
        description: "ไข่เจียวทอดกรอบนอกนุ่มใน รับประทานกับข้าวสวยร้อน ๆ",
        price: 35,
        image: "images/khai jeaw.jpg"
    }
];

// ฟังก์ชันสุ่มเมนูอาหาร
let previousIndex = -1;

function randomFood() {

    let randomIndex;

    do {
        randomIndex = Math.floor(Math.random() * foods.length);
    } while (randomIndex === previousIndex);

    previousIndex = randomIndex;

    const selectedFood = foods[randomIndex];

    // เปลี่ยนรูปภาพ
    document.getElementById("foodImage").src =
        selectedFood.image;

    // เปลี่ยนชื่ออาหาร
    document.getElementById("foodName").innerText =
        selectedFood.name;

    // เปลี่ยนคำอธิบาย
    document.getElementById("foodDescription").innerText =
        selectedFood.description;

    // เปลี่ยนราคา
    document.getElementById("foodPrice").innerText =
        "ราคา " + selectedFood.price + " บาท";
}

</script>

</body>
</html>
