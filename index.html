<!DOCTYPE html>
<html lang="'th">
    <head>
        <meta charset="UTF-8">
        <title>Profile card</title>
        <style>
            h3 {
                color: rgb(255, 255, 255);
            }
            .card {
                display: flex;
                margin: auto auto;
                border: 1px solid #000000;
                border-radius: 12px;
                padding: 20px;
                color: rgb(255, 255, 255);
                background-color: rgb(110, 110, 110);
            }
            .todo {
                padding-left: 30px;
            }
            .button {
                background-color: #ffffff;
                border: 1px solid #000000;
                padding: auto auto;
                text-align: center;
                text-decoration: none;
                display: inline-block;
                margin: 4px 2px;
                cursor: pointer;
                border-radius: 8px;
            }
            .ig {
                color: #ff2587;
            }
            .profilepic {
                border-radius: 50px;
                border: 3px solid #ffffff;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <div clss="profile">
                <img src="big gwen.png" class="profilepic" alt ="placeholder" width="100" height="100">
                <h3>Chitsanuphong Phawa</h3>

                <p>IT KMITL</p>
                <p>Eat. Sleep. Repeat.</p>
                <a href="https://www.instagram.com/cnp_pwa/" class="ig" target="_blank">IG</a>
            </div>
            <div class="todo">
                <h3>To-do List</h3>
                <input type="text" placeholder="To-do">
                <button class="button">เพิ่ม</button>

                    <li>sleep

    </body>
</html>
